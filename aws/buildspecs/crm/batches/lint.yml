version: 0.2

env:
  # The Alpine DinD image has sh only until install_packages.sh installs Bash.
  shell: /bin/sh
  variables:
    ACCOUNT_ID: $ACCOUNT_ID
    ENVIRONMENT: $ENVIRONMENT
    TEST_REPORTS_BUCKET: $TEST_REPORTS_BUCKET
    LHCI_REPORTS_BUCKET: $LHCI_REPORTS_BUCKET
    CRM_GIT_REPOSITORY_LINK: $CRM_GIT_REPOSITORY_LINK
    DIND: "1"

phases:
  install:
    commands:
      - '/bin/sh "${CODEBUILD_SRC_DIR}/${SCRIPT_DIR}/sh/install_packages.sh"'
      - |
        bash -e <<'BASH'
        . "${CODEBUILD_SRC_DIR}/${SCRIPT_DIR}/sh/crm_installation.sh"
        . "${CODEBUILD_SRC_DIR}/${SCRIPT_DIR}/sh/setup_docker.sh"
        BASH

  build:
    commands:
      - |
        bash -e <<'BASH'
        cd "${CODEBUILD_SRC_DIR}/crm"
        . "${CODEBUILD_SRC_DIR}/${SCRIPT_DIR}/sh/create_env.sh"
        echo "Running lint checks"
        . "${CODEBUILD_SRC_DIR}/crm/scripts/ci/batch_unit_mutation_integration_lint.sh" test-lint
        BASH
    finally:
      - |
        bash -e <<'BASH'
        cd "${CODEBUILD_SRC_DIR}/crm"
        . "${CODEBUILD_SRC_DIR}/${SCRIPT_DIR}/sh/create_env.sh"
        . "${CODEBUILD_SRC_DIR}/${SCRIPT_DIR}/sh/run_reports.sh"
        BASH
      - "mkdir -p ${CODEBUILD_SRC_DIR}/codepipeline-artifacts"
      - "printf 'lint complete\n' > ${CODEBUILD_SRC_DIR}/codepipeline-artifacts/lint.txt"

artifacts:
  files:
    - "codepipeline-artifacts/lint.txt"
