version: 0.2

phases:
  install:
    commands:
      - "python3 --version"
      - '[ -n "${CRM_URL:-}" ] || { echo "CRM_URL must be set for the CRM healthcheck"; exit 1; }'
  build:
    commands:
      - "echo ## Test Crm Connection..."
      - |
        if [ "${ENABLE_CLOUDFRONT_STAGING:-true}" = "true" ]; then
          python3 "${CODEBUILD_SRC_DIR}/${SCRIPT_DIR}/py/spa_healthcheck.py" --url "https://${CRM_URL}" --staging \
            --deployment-manifest "${CODEBUILD_SRC_DIR_DeployOutput:?Missing deployment artifact}/codepipeline-artifacts/deployment.json"
        else
          python3 "${CODEBUILD_SRC_DIR}/${SCRIPT_DIR}/py/spa_healthcheck.py" --url "https://${CRM_URL}" \
            --deployment-manifest "${CODEBUILD_SRC_DIR_DeployOutput:?Missing deployment artifact}/codepipeline-artifacts/deployment.json"
        fi
      - "python3 ${CODEBUILD_SRC_DIR}/aws/scripts/py/healthcheck.py --url https://${CRM_URL} --expect-cn ${CRM_URL} --expect-issuer-country US --expect-issuer-org Amazon --expect-issuer-cn-regex 'Amazon RSA 2048 M[0-9]+' --min-cert-days 30"
    finally:
      - "mkdir -p ${CODEBUILD_SRC_DIR}/codepipeline-artifacts"
      - "printf 'healthcheck complete\n' > ${CODEBUILD_SRC_DIR}/codepipeline-artifacts/healthcheck.txt"

artifacts:
  files:
    - "codepipeline-artifacts/healthcheck.txt"
